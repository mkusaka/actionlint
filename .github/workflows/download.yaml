name: Download script
on:
  push:
    paths:
      - scripts/download-yactionlint.bash
      - scripts/test-download-yactionlint.bash
  pull_request:
    paths:
      - scripts/download-yactionlint.bash
      - scripts/test-download-yactionlint.bash
  workflow_dispatch:

jobs:
  download:
    name: Test download script
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/test-download-yactionlint.bash
        shell: bash
