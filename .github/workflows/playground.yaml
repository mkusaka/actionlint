name: Playground
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/playground.yaml'
      - 'playground/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: ./playground/package-lock.json
      - run: npm ci && make build && npm run lint && npm test
        working-directory: ./playground
      - name: Stage site
        run: |
          mkdir playground-dist
          cp -R playground/index.html playground/index.js playground/index.js.map playground/lib playground/main.wasm playground/style.css playground-dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./playground-dist
      - id: deployment
        uses: actions/deploy-pages@v4
